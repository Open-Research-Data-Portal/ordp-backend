<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; background-color:#f5f5f3; font-family:Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f3; padding:40px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
          <tr>
            <td style="background-color:#0a1a3c; padding:24px 32px;">
              <span style="color:#ffffff; font-size:20px; font-weight:bold;">ORDP</span>
              <span style="color:#a9b4c9; font-size:13px; display:block;">AASTU Research Portal</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h2 style="color:#0a1a3c; margin-top:0;">Verify your email</h2>
              <p style="color:#444; line-height:1.5;">
                Welcome to ORDP, {{ full_name }}. Click below to verify your account.
                This link expires soon — if it does, you can request a new one.
              </p>
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0;">
                <tr>
                  <td style="background-color:#b8860b; border-radius:4px;">
                    <a href="{{ verify_link }}" style="display:inline-block; padding:12px 28px; color:#ffffff; text-decoration:none; font-weight:bold;">
                      Verify Email
                    </a>
                  </td>
                </tr>
              </table>
              <p style="color:#888; font-size:12px;">
                Or copy this link: <br>{{ verify_link }}
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
