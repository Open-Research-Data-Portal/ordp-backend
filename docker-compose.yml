services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  django:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  ai-worker:
    build:
      context: ./ai_worker
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - ORDP_WORKER_TOKEN=${ORDP_WORKER_TOKEN:-changeme-worker-token}
      - AI_BACKEND_URL=http://django:8000
      - AI_WORKER_ID=ai-worker-compose
    depends_on:
      - django

volumes:
  postgres_data:
